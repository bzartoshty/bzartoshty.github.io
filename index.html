<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bahram Zartoshty | Computer Science Lecturer</title>

<style>
:root{
    --primary:#0f172a;
    --secondary:#2563eb;
    --bg:#ffffff;
    --card:#f8fafc;
    --text:#334155;
    --border:#e2e8f0;
}

[data-theme="dark"]{
    --primary:#e2e8f0;
    --secondary:#60a5fa;
    --bg:#0f172a;
    --card:#1e293b;
    --text:#cbd5e1;
    --border:#334155;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

nav{
    position:sticky;
    top:0;
    background:var(--bg);
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    z-index:1000;
}

.nav-container{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
}

.logo{
    font-weight:bold;
    color:var(--secondary);
}

.nav-links{
    display:flex;
    gap:20px;
    list-style:none;
}

.nav-links a{
    text-decoration:none;
    color:var(--text);
    font-weight:600;
}

.nav-links a:hover{
    color:var(--secondary);
}

.theme-btn{
    border:none;
    background:var(--secondary);
    color:white;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
}

.hero{
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
    padding:40px;
}

.hero-content{
    max-width:800px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:10px;
}

.hero p{
    font-size:1.25rem;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    margin:5px;
    padding:12px 24px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.btn-primary{
    background:white;
    color:#2563eb;
}

.btn-secondary{
    color:white;
    border:2px solid white;
}

section{
    max-width:1200px;
    margin:auto;
    padding:80px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:40px;
}

.section-title h2{
    color:var(--secondary);
    font-size:2.2rem;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:25px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    color:var(--secondary);
    margin-bottom:10px;
}

.contact{
    text-align:center;
}

.contact a{
    color:var(--secondary);
    text-decoration:none;
}

footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:30px;
}

@media(max-width:768px){

    .nav-container{
        flex-direction:column;
        gap:10px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero h1{
        font-size:2.2rem;
    }
}
</style>
</head>
